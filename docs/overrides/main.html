{% extends "base.html" %}

<!-- Custom front matter -->
{% block extrahead %}
  <!-- Extra style sheets (can't be set in mkdocs.yml due to content hash) -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/pixel_icon_32x32.png">
  <link rel="manifest" href="/assets/site.webmanifest">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
  <meta name="msapplication-TileColor" content="#da532c">
  <meta name="theme-color" content="#ffffff">
  <!-- Seeing which analytics are best for me, should remove one of these -->
  <!-- Umami Analytics -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="90f49824-ce6a-459b-88ce-cc3aef8e41b0"></script>
  <!-- GoatCounter Analytics -->
  <script data-goatcounter="https://leonfedden.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
{% endblock %}

<!-- Announcement bar -->
{% block announce %}
  I've migrated from X to <a href="https://bsky.app/profile/leonfedden.bsky.social">
    <span class="twemoji bluesky">
      {% include ".icons/fontawesome/brands/bluesky.svg" %}
    </span>
    <strong>Bluesky</strong>
  </a>. I'm also on <a href="https://www.linkedin.com/in/leon-fedden/">
    <span class="twemoji linkedin">
      {% include ".icons/fontawesome/brands/linkedin.svg" %}
    </span>
    <strong>LinkedIn</strong>
  </a> for professional inquiries.
{% endblock %}
