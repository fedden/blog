{% extends "base.html" %}

<!-- Custom front matter -->
{% block extrahead %}
  <!-- Extra style sheets (can't be set in mkdocs.yml due to content hash) -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/pixel_icon_32x32.png">
  <link rel="manifest" href="/assets/site.webmanifest">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
  <meta name="msapplication-TileColor" content="#da532c">
  <meta name="theme-color" content="#ffffff">
{% endblock %}


<!-- Announcement bar -->
{% block announce %}
  I'm available on <a href="https://bsky.app/profile/leonfedden.bsky.social">
    <span class="twemoji bluesky">
      {% include ".icons/fontawesome/brands/bluesky.svg" %}
    </span>
    <strong>Bluesky</strong>
  </a> and <a href="https://www.linkedin.com/in/leon-fedden/">
    <span class="twemoji linkedin">
      {% include ".icons/fontawesome/brands/linkedin.svg" %}
    </span>
    <strong>LinkedIn</strong>
  </a> for professional inquiries.
{% endblock %}
