site_name: Leon's Blog
theme:
  name: material
  logo: assets/sprite.gif
  language: en
  custom_dir: docs/overrides
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.link
    - content.code.highlight
    - content.code.meta
    - content.code.titles
    - header.autohide
    - navigation.breadcrumbs
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
  palette:
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: blue grey
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      primary: blue grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

plugins:
  - social
  - search
  - awesome-pages
  - blog:
      enabled: true
      blog_toc: true
      post_date_format: full
      post_url_date_format: yyyy/MM
      post_excerpt: required
  - gh-admonitions
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
      permalink_class: headerlink
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
      pygments_lang_class: true
      auto_title: true
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.smartsymbols
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.superfences 
extra:
  generator: false
  social:
    - icon: simple/github
      link: https://github.com/fedden
      name: GitHub - Leon Fedden
  blog:
    dir: blog
    author: Leon Fedden
    author_image: https://avatars.githubusercontent.com/u/11923487
    words_read_per_minute: 300
    list_length: 25
    extended_preview: true
extra_javascript:
  - js/mathjax.js
  - js/sidenotes.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - css/latex.css
  - css/animation.css
  - css/tabs.css
hooks:
  - custom_hooks.py
